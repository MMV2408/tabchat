<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }
  #backdrop { position: fixed; inset: 0; background: var(--backdrop); }
  #box {
    position: relative;
    width: min(560px, calc(100% - 32px));
    margin: 70px auto 0;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
    overflow: hidden;
  }
  input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text-strong);
    font-size: 17px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    font-family: inherit;
  }
  input::placeholder { color: var(--text-faint); }
  ul { list-style: none; margin: 0; padding: 6px; max-height: 380px; overflow-y: auto; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--text);
  }
  li.sel { background: var(--bg-sel); color: var(--text-strong); }
  .icon {
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--text-strong);
    background: var(--bg-2);
  }
  .icon.colored { color: #fff; }
  .text { flex: 1; min-width: 0; }
  .title { font-size: 14px; }
  .sub { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd {
    font-family: inherit; font-size: 11px; color: var(--text-soft);
    background: var(--bg-0); border: 1px solid var(--bg-3); border-radius: 5px; padding: 2px 6px; white-space: nowrap;
  }
  .empty { color: var(--text-muted); padding: 14px; font-size: 14px; }
  .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-faint); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="box">
  <input id="q" data-i18n-placeholder="pal.placeholder" autocomplete="off" spellcheck="false">
  <ul id="list"></ul>
  <div class="foot"><span data-i18n="pal.choose"></span><span data-i18n="pal.open"></span><span data-i18n="pal.close"></span></div>
</div>

<script>
  // ---------- translations (see src/main/i18n.js) ----------
  let L = {};
  let curLang = null;
  const T = (k, v = {}) => {
    let s = L[k] ?? k;
    for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(b);
    return s;
  };
  async function loadStrings(lang) {
    if (lang && lang === curLang) return;
    const r = await window.tabchat.getStrings();
    L = r.strings;
    curLang = r.lang;
    document.documentElement.lang = r.lang;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = T(e.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(e => { e.placeholder = T(e.dataset.i18nPlaceholder); });
  }

  const q = document.getElementById('q');
  const list = document.getElementById('list');
  let items = [];
  let shown = [];
  let sel = 0;

  // Build all rows from the app's current state
  function build(s) {
    const out = [];
    const present = new Set(s.tabs.map(t => t.service));

    s.tabs.forEach((t, i) => out.push({
      run: { type: 'tab', id: t.id }, title: t.fullLabel || t.label, sub: T('pal.openTab'),
      color: t.color, letter: t.label[0], hint: i < 8 ? 'Alt+' + (i + 1) : '', words: t.fullLabel || t.label
    }));

    // Microsoft: "Outlook (Work/school)" and "Outlook (Personal)"
    const hasPersonal = (id) => s.catalog.some(x => x.base === id);
    const cname = (c) => c.base ? `${c.name} (${T('acct.personal')})` : hasPersonal(c.id) ? `${c.name} (${T('acct.work')})` : c.name;
    const cwords = (c) => c.base ? ' privé personal hotmail live outlook.com' : hasPersonal(c.id) ? ' school werk work' : '';

    const hidden = new Set((s.settings && s.settings.hiddenServices) || []);
    for (const c of s.catalog) if (!present.has(c.id) && !hidden.has(c.id) && !hidden.has(c.base)) out.push({
      run: { type: 'add', service: c.id }, title: T('pal.add', { name: cname(c) }), sub: c.desc,
      color: c.color, letter: c.name[0], hint: '', words: c.name + ' toevoegen add' + cwords(c)
    });

    const action = (id, title, hint, icon, words, allowed = true) => {
      if (allowed) out.push({ run: { type: 'action', id }, title, sub: '', icon, hint, words: title + ' ' + words });
    };
    const tab = s.activeIsTab;
    // Search words in both languages, so searching always works
    action('reload', T('pal.reload'), 'F5', '↻', 'herladen vernieuwen reload refresh', tab);
    action('reloadAll', T('pal.reloadAll'), '', '↻', 'alles herladen vernieuwen reload refresh all vastgelopen stuck', s.tabs.length > 0);
    action('mute', T(s.activeMuted ? 'pal.unmute' : 'pal.mute'), 'Alt+M', '🔇', 'dempen mute geluid stil sound', tab);
    action('sleepNow', T('pal.sleep'), '', '💤', 'slapen slaapstand geheugen sleep memory', tab);
    action('close', T('pal.closeTab'), 'Ctrl+W', '✕', 'sluiten close', tab);
    action('reopen', T('pal.reopen'), 'Ctrl+Shift+T', '↺', 'terughalen herstellen reopen restore', s.canReopen);
    action('zoomIn', T('pal.zoomIn'), 'Ctrl+Plus', '+', 'zoom groter bigger', tab);
    action('zoomOut', T('pal.zoomOut'), 'Ctrl+Min', '−', 'zoom kleiner smaller', tab);
    action('zoomReset', T('pal.zoomReset'), 'Ctrl+0', '1:1', 'zoom normaal reset 100', tab);
    action('fullscreen', T('pal.fullscreen'), 'F11', '⛶', 'fullscreen volledig groot');
    if (s.dnd && s.dnd.on) {
      action('dndOff', T('pal.dndOff'), '', '🔔', 'niet storen dnd do not disturb uit off');
    } else {
      action('dnd60', T('pal.dnd60'), '', '🌙', 'niet storen dnd do not disturb stil quiet');
      action('dndTomorrow', T('pal.dndTomorrow'), '', '🌙', 'niet storen dnd do not disturb stil quiet');
      action('dndForever', T('pal.dndForever'), '', '🌙', 'niet storen dnd do not disturb stil quiet');
    }
    action('settings', T('pal.settings'), 'Alt+T', '⚙', 'instellingen plus toevoegen settings add');
    action('shortcuts', T('pal.shortcuts'), '', '⌨', 'sneltoetsen toetsen shortcuts keys help');

    for (const c of s.catalog) if (present.has(c.id)) out.push({
      run: { type: 'add', service: c.id }, title: T('pal.another', { name: cname(c) }), sub: T('pal.anotherSub'),
      color: c.color, letter: c.name[0], hint: '', words: c.name + ' toevoegen account extra another' + cwords(c)
    });

    action('quit', T('pal.quit'), 'Ctrl+Q', '⏻', 'afsluiten quit stoppen exit');
    return out;
  }

  function filter() {
    const words = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    shown = items.filter(it => {
      const hay = (it.title + ' ' + it.words).toLowerCase();
      return words.every(w => hay.includes(w));
    });
    sel = 0;
    render();
  }

  function render() {
    list.replaceChildren();
    if (!shown.length) {
      const li = document.createElement('div');
      li.className = 'empty';
      li.textContent = T('pal.none');
      list.append(li);
      return;
    }
    shown.forEach((it, i) => {
      const li = document.createElement('li');
      if (i === sel) li.className = 'sel';
      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = it.icon || it.letter;
      if (it.color) { icon.style.background = it.color; icon.classList.add('colored'); }
      const text = document.createElement('div');
      text.className = 'text';
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = it.title;
      text.append(title);
      if (it.sub) {
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = it.sub;
        text.append(sub);
      }
      li.append(icon, text);
      if (it.hint) {
        const k = document.createElement('kbd');
        k.textContent = it.hint;
        li.append(k);
      }
      li.onmousemove = () => { if (sel !== i) { sel = i; render(); } };
      li.onclick = () => window.tabchat.paletteRun(it.run);
      list.append(li);
    });
    const cur = list.children[sel];
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

  q.addEventListener('input', filter);
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, shown.length - 1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (shown[sel]) window.tabchat.paletteRun(shown[sel].run); e.preventDefault(); }
    else if (e.key === 'Escape') { window.tabchat.paletteClose(); e.preventDefault(); }
  });
  document.getElementById('backdrop').onclick = () => window.tabchat.paletteClose();

  window.tabchat.onPaletteOpen(async (s) => {
    await loadStrings(s.lang);
    items = build(s);
    q.value = '';
    filter();
    q.focus();
  });
</script>
</body>
</html>
