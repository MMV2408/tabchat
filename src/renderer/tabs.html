<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    -webkit-app-region: drag; /* empty spots: drag the window, double-click = maximize */
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 0 0 8px;
    background: var(--bg-0);
    font-family: system-ui, sans-serif;
    user-select: none;
    overflow: hidden;
  }
  /* Every button is as tall as the whole bar (so it's clickable everywhere, even at the very top);
     the visible "pill" sits inside it. */
  button {
    -webkit-app-region: no-drag;
    height: 100%;
    border: none;
    padding: 0;
    margin: 0;
    background: transparent;
    color: var(--tab-text);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .pill {
    height: 32px;
    border-radius: 8px;
    padding: 0 14px;
    background: var(--bg-1);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    position: relative;
  }
  button:hover .pill { background: var(--bg-2); }
  button.active .pill { background: var(--bg-3); color: var(--text-strong); }
  button.insplit:not(.focused) .pill { background: color-mix(in srgb, var(--bg-3) 55%, transparent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  /* ← → ⟳ ⌂ on the left */
  .navbar { display: flex; align-items: center; height: 100%; gap: 2px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); flex-shrink: 0; -webkit-app-region: no-drag; }
  .navbtn { width: 30px; justify-content: center; font-size: 15px; }
  .navbtn:hover { background: var(--bg-1); border-radius: 7px; }
  .navbtn.off { opacity: .35; cursor: default; }
  .navbtn.off:hover { background: transparent; }
  /* split view: the two tabs in one quiet frame */
  .pair { display: flex; align-items: center; gap: 2px; height: 36px; padding: 2px; border-radius: 10px; background: var(--bg-1); flex-shrink: 0; }
  .pair .pill { height: 28px; border-radius: 7px; padding: 0 11px; background: transparent; }
  .pair button:hover .pill { background: var(--bg-2); }
  .pair button.focused .pill { background: var(--bg-3); }
  .pairicon { font-size: 12px; opacity: .7; padding: 0 2px 0 6px; }
  body.compact .pair .pill { width: 28px; padding: 0; }
  .muted { font-size: 12px; opacity: .8; }
  /* unread */
  .count { background: #f23f43; color: #fff; font-size: 11px; font-weight: 700; border-radius: 9px; padding: 1px 6px; min-width: 18px; text-align: center; }
  .udot { width: 8px; height: 8px; border-radius: 50%; background: #f23f43; }
  #plus .pill { width: 32px; padding: 0; justify-content: center; font-size: 20px; }
  /* tab sleep */
  button.asleep .pill { opacity: .5; }
  button.asleep.active .pill { opacity: 1; }
  .zz { font-size: 12px; }
  /* Work/school or personal (Microsoft) */
  .acct { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgba(127, 127, 140, .22); color: inherit; }
  .acct.personal { background: var(--personal-bg); color: var(--personal-text); }
  .acct.temp { background: rgba(140, 90, 220, .25); }
  /* update */
  #update .pill { background: #1f6f43; color: #fff; font-size: 13px; }
  #update:hover .pill { background: #24834f; }
  #whatsnew .pill { background: #5865F2; color: #fff; font-size: 13px; }
  #whatsnew:hover .pill { background: #4752c4; }
  #downloads .pill { font-size: 13px; font-variant-numeric: tabular-nums; }
  /* do not disturb */
  #dnd .pill { background: var(--dnd-bg); color: var(--dnd-text); font-size: 13px; }
  #dnd:hover .pill { background: var(--dnd-hover); }
  /* tabs on the left (scroll when there are many); empty space behind = drag the window */
  .tabs { -webkit-app-region: no-drag; flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .spacer { flex: 1; min-width: 12px; height: 100%; -webkit-app-region: drag; }
  .right { display: flex; align-items: center; gap: 6px; height: 100%; -webkit-app-region: no-drag; }
  /* − □ ✕: full height, like Ubuntu buttons */
  .ctl { width: 42px; justify-content: center; }
  .ctl:hover { background: var(--bg-2); }
  .ctl.close:hover { background: #e5484d; color: #fff; }
  .ctl svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.4; fill: none; }
  /* compact: just a colored icon per tab */
  body.compact button.tab .pill { width: 32px; padding: 0; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
  body.compact button.tab.active .pill { box-shadow: 0 0 0 2px var(--text-strong); }
  body.compact button.tab .count, body.compact button.tab .udot { position: absolute; top: -4px; right: -6px; }
  body.compact button.tab .count { font-size: 9px; padding: 0 4px; min-width: 15px; }
  /* dragging */
  .dragging { opacity: .4; }
  .drop-before .pill { box-shadow: inset 3px 0 0 #5865F2; }
  .drop-after .pill { box-shadow: inset -3px 0 0 #5865F2; }
</style>
</head>
<body>
<script>
  // ---------- translations (see src/main/i18n.js) ----------
  let L = {};
  let curLang = null;
  const T = (k, v = {}) => {
    let s = L[k] ?? k;
    for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(b);
    return s;
  };
  async function loadStrings(lang) {
    if (lang && lang === curLang) return;
    const r = await window.tabchat.getStrings();
    L = r.strings;
    curLang = r.lang;
    document.documentElement.lang = r.lang;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = T(e.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(e => { e.placeholder = T(e.dataset.i18nPlaceholder); });
  }

  let dragId = null;

  function clearDrop() {
    document.querySelectorAll('.drop-before, .drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  }

  // Makes a button a place where you can drop a tab
  function dropTarget(el, indexBefore, indexAfter) {
    el.ondragover = (e) => {
      if (!dragId) return;
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const after = indexAfter != null && e.clientX > r.left + r.width / 2;
      clearDrop();
      el.classList.add(after ? 'drop-after' : 'drop-before');
    };
    el.ondragleave = () => el.classList.remove('drop-before', 'drop-after');
    el.ondrop = (e) => {
      e.preventDefault();
      if (!dragId) return;
      const after = el.classList.contains('drop-after');
      clearDrop();
      window.tabchat.reorder(dragId, after ? indexAfter : indexBefore);
    };
  }

  const ICONS = {
    minimize: '<svg viewBox="0 0 12 12"><path d="M2 6.5h8"/></svg>',
    maximize: '<svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>',
    restore: '<svg viewBox="0 0 12 12"><rect x="2" y="3.5" width="6.5" height="6.5" rx="1"/><path d="M4 3.5V2h6v6H8.5"/></svg>',
    close: '<svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>'
  };
  function control(kind, action, title) {
    const b = document.createElement('button');
    b.className = 'ctl' + (kind === 'close' ? ' close' : '');
    b.innerHTML = ICONS[kind];
    b.title = title;
    b.onclick = () => window.tabchat.winControl(action);
    return b;
  }

  // Auto-hide: this way the app knows when the mouse is on the bar
  document.documentElement.addEventListener('mouseenter', () => window.tabchat.barHover(true));
  document.documentElement.addEventListener('mouseleave', () => window.tabchat.barHover(false));

  function render(s) {
    document.body.replaceChildren();
    const strip = document.createElement('div');
    strip.className = 'tabs';
    document.body.append(strip);
    const compact = s.settings && s.settings.tabBar === 'compact';
    document.body.classList.toggle('compact', compact);

    // ← → ⟳ ⌂ on a fixed spot on the left; they work on the active tab
    const at = s.tabs.find(t => t.id === s.active);
    const navBox = document.createElement('div');
    navBox.className = 'navbar';
    for (const [what, icon, key] of [['back', '←', 'nav.back'], ['forward', '→', 'nav.forward'], ['reload', '⟳', 'nav.reload'], ['home', '⌂', 'nav.home']]) {
      const ok = !!(at && at.nav) && (what === 'back' ? at.nav.back : what === 'forward' ? at.nav.forward : true);
      const n = document.createElement('button');
      n.className = 'navbtn' + (ok ? '' : ' off');
      n.textContent = icon;
      n.title = T(key);
      n.onmousedown = (e) => { if (e.button === 0 && ok) window.tabchat.tabNav(at.id, what); };
      navBox.append(n);
    }
    document.body.insertBefore(navBox, strip);

    // Split view: the two tabs sit together in one frame (left half first), wherever they are in the bar
    const pairIds = s.split ? [s.split.left, s.split.right] : [];
    let pairDone = false;

    const makeTab = (t, i) => {
      const b = document.createElement('button');
      const pill = document.createElement('span');
      pill.className = 'pill';
      b.append(pill);
      b.title = (i < 8 ? 'Alt+' + (i + 1) + ' · ' : '') + T('tabs.hint');
      if (s.active === t.id) b.classList.add('active', 'focused');
      if (s.split && (s.split.left === t.id || s.split.right === t.id)) b.classList.add('active', 'insplit');
      if (t.asleep) { b.classList.add('asleep'); b.title = T('tabs.asleep') + ' · ' + b.title; }
      b.classList.add('tab');
      if (compact) {
        // Only a colored letter; the name is in the tooltip
        pill.style.background = t.color;
        pill.append(document.createTextNode(t.label[0]));
        b.title = (t.fullLabel || t.label) + ' · ' + b.title;
      } else {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = t.color;
        pill.append(dot, document.createTextNode(t.label));
      }
      if (t.tag && !compact) {
        const a = document.createElement('span');
        a.className = 'acct ' + t.tag;
        a.textContent = T('acct.' + t.tag);
        pill.append(a);
      }
      if (typeof t.unread === 'number' && t.unread > 0) {
        const c = document.createElement('span');
        c.className = 'count';
        c.textContent = t.unread > 99 ? '99+' : t.unread;
        pill.append(c);
      } else if (t.unread === 'dot') {
        const d = document.createElement('span');
        d.className = 'udot';
        pill.append(d);
      }
      if (t.asleep && !compact) {
        const z = document.createElement('span');
        z.className = 'zz';
        z.textContent = '💤';
        pill.append(z);
      }
      if (t.muted && !compact) {
        const m = document.createElement('span');
        m.className = 'muted';
        m.textContent = '🔇';
        pill.append(m);
      }
      // Select on press (like a browser): also works when the bar just appeared
      b.onmousedown = (e) => { if (e.button === 0) window.tabchat.open(t.id); };
      b.oncontextmenu = (e) => { e.preventDefault(); window.tabchat.tabMenu(t.id); };

      b.draggable = true;
      b.ondragstart = (e) => {
        dragId = t.id;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', t.id);
        b.classList.add('dragging');
        window.tabchat.barHold(true);
      };
      b.ondragend = () => { dragId = null; b.classList.remove('dragging'); clearDrop(); window.tabchat.barHold(false); };
      dropTarget(b, i, i + 1);
      return b;
    };

    s.tabs.forEach((t, i) => {
      if (!pairIds.includes(t.id)) return strip.append(makeTab(t, i));
      if (pairDone) return;
      pairDone = true;
      const group = document.createElement('div');
      group.className = 'pair';
      const ic = document.createElement('span');
      ic.className = 'pairicon';
      ic.textContent = '◫';
      ic.title = T('keys.split');
      group.append(ic);
      for (const id of pairIds) {
        const j = s.tabs.findIndex(x => x.id === id);
        group.append(makeTab(s.tabs[j], j));
      }
      strip.append(group);
    });

    const plus = document.createElement('button');
    plus.id = 'plus';
    plus.innerHTML = '<span class="pill">+</span>';
    plus.title = T('tabs.plus');
    if (s.active === 'home') plus.classList.add('active');
    plus.onmousedown = (e) => { if (e.button === 0) window.tabchat.open('home'); };
    dropTarget(plus, s.tabs.length, null); // dropped on + = all the way at the end
    strip.append(plus);

    // Empty space: drag the window here
    const spacer = document.createElement('div');
    spacer.className = 'spacer';
    strip.append(spacer);

    // Right: update, Do not disturb, − □ ✕
    const rightBox = document.createElement('div');
    rightBox.className = 'right';
    document.body.append(rightBox);
    const pillText = (btn, text) => { const p = document.createElement('span'); p.className = 'pill'; p.textContent = text; btn.append(p); };
    // ✨ New in … (after an update; goes away once clicked)
    if (s.whatsNew) {
      const w = document.createElement('button');
      w.id = 'whatsnew';
      pillText(w, T('tabs.whatsNew', { v: s.whatsNew }));
      w.title = T('tabs.whatsNewTitle');
      w.onclick = () => window.tabchat.openWhatsNew();
      rightBox.append(w);
    }
    // ⬇ Downloads: progress while downloading, count of new ones after
    const dl = s.downloads;
    if (dl && (dl.active || dl.unseen)) {
      const d = document.createElement('button');
      d.id = 'downloads';
      pillText(d, dl.active ? (dl.percent != null ? `⬇ ${dl.percent}%` : '⬇ …') : `⬇ ${dl.unseen}`);
      d.title = T('tabs.downloads');
      d.onclick = () => window.tabchat.dlShow();
      rightBox.append(d);
    }
    if (s.update && (s.update.state === 'ready' || s.update.state === 'failed')) {
      const u = document.createElement('button');
      u.id = 'update';
      pillText(u, T('tabs.update', { v: s.update.version }));
      u.title = T('tabs.updateTitle');
      u.onclick = () => window.tabchat.installUpdate();
      rightBox.append(u);
    }

    // Do not disturb: label on the right, click = turn off
    if (s.dnd && s.dnd.on) {
      const d = document.createElement('button');
      d.id = 'dnd';
      if (s.dnd.manual) {
        pillText(d, T('tabs.dnd', { label: s.dnd.label }));
        d.title = T('tabs.dndTitle');
        d.onclick = () => window.tabchat.setDnd(null);
      } else {
        // Turned on via Ubuntu: it can only be turned off in Ubuntu itself
        pillText(d, T('tabs.dndSystem'));
        d.title = T('tabs.dndSystemTitle');
        d.style.cursor = 'default';
      }
      rightBox.append(d);
    }

    // − □ ✕ (the Ubuntu title bar is gone)
    rightBox.append(
      control('minimize', 'minimize', T('win.minimize')),
      control(s.maximized ? 'restore' : 'maximize', 'maximize', T(s.maximized ? 'win.restore' : 'win.maximize')),
      control('close', 'close', T('win.close'))
    );
  }

  // Only rebuild when something changed for the bar; a click that lands in the middle of
  // a rebuild would otherwise get lost
  let lastKey = '';
  const update = async (s) => {
    await loadStrings(s.lang);
    const key = JSON.stringify([s.lang, s.active, s.split, s.tabs, s.update && s.update.state, s.update && s.update.version, s.whatsNew, s.downloads && [s.downloads.active, s.downloads.percent, s.downloads.unseen], s.dnd, s.maximized, s.settings && s.settings.tabBar]);
    if (key === lastKey) return;
    lastKey = key;
    render(s);
  };
  window.tabchat.onState(update);
  window.tabchat.getState().then(update);
</script>
</body>
</html>
