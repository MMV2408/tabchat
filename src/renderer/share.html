<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font-family: system-ui, sans-serif; color: #dbdee1; }
  #backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); }
  #box {
    position: relative;
    width: min(760px, calc(100% - 32px));
    max-height: calc(100% - 80px);
    margin: 40px auto 0;
    background: #2b2d31;
    border: 1px solid #3f4147;
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header { padding: 18px 20px 6px; }
  h1 { margin: 0; font-size: 19px; color: #fff; }
  .sub { margin: 4px 0 0; font-size: 13px; color: #949ba4; }
  main { overflow-y: auto; padding: 4px 20px 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #949ba4; margin: 16px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .item {
    background: #1e1f22; border: 2px solid transparent; border-radius: 10px;
    padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit;
  }
  .item:hover { border-color: #4e5058; }
  .item.sel { border-color: #5865F2; }
  .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #111214; border-radius: 6px; display: block; }
  .name { font-size: 13px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid #3f4147; }
  button.act { border: none; border-radius: 8px; padding: 9px 16px; font: inherit; font-size: 14px; cursor: pointer; }
  #cancel { background: transparent; color: #dbdee1; }
  #cancel:hover { background: #35373c; }
  #ok { background: #5865F2; color: #fff; }
  #ok:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="box" role="dialog" aria-label="Scherm delen">
  <header>
    <h1>Wat wil je delen?</h1>
    <p class="sub">Kies een scherm of venster. Geluid delen kan op Linux niet.</p>
  </header>
  <main id="list"></main>
  <footer>
    <button class="act" id="cancel">Annuleren</button>
    <button class="act" id="ok" disabled>Delen</button>
  </footer>
</div>

<script>
  const list = document.getElementById('list');
  const ok = document.getElementById('ok');
  let selected = null;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function select(id) {
    selected = id;
    document.querySelectorAll('.item').forEach(x => x.classList.toggle('sel', x.dataset.id === id));
    ok.disabled = !id;
  }

  function render(sources) {
    list.replaceChildren();
    selected = null;
    ok.disabled = true;
    const groups = [['screen', 'Schermen'], ['window', 'Vensters']];
    for (const [type, title] of groups) {
      const items = sources.filter(s => s.type === type);
      if (!items.length) continue;
      list.append(el('h2', null, title));
      const grid = el('div', 'grid');
      for (const s of items) {
        const b = el('button', 'item');
        b.dataset.id = s.id;
        const img = el('img', 'thumb');
        if (s.thumb) img.src = s.thumb;
        img.alt = '';
        b.append(img, el('div', 'name', s.name));
        b.title = s.name;
        b.onclick = () => select(s.id);
        b.ondblclick = () => window.tabchat.sharePick(s.id);
        grid.append(b);
      }
      list.append(grid);
    }
    // Eerste scherm alvast selecteren
    const first = sources.find(s => s.type === 'screen') || sources[0];
    if (first) select(first.id);
    ok.focus();
  }

  ok.onclick = () => { if (selected) window.tabchat.sharePick(selected); };
  document.getElementById('cancel').onclick = () => window.tabchat.shareCancel();
  document.getElementById('backdrop').onclick = () => window.tabchat.shareCancel();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { window.tabchat.shareCancel(); e.preventDefault(); }
    if (e.key === 'Enter' && selected) { window.tabchat.sharePick(selected); e.preventDefault(); }
  });

  window.tabchat.onShareOpen(render);
</script>
</body>
</html>
