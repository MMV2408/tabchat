[package]
name = "tabchat-helper"
version = "1.0.0"
edition = "2021"
description = "Small native helper for Tabchat: sends desktop notifications over D-Bus"
license = "MIT"
publish = false

[dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
