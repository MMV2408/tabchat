<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-1);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 24px 48px; }
  h1 { margin: 0 0 4px; font-size: 26px; color: var(--text-strong); }
  .sub { margin: 0 0 32px; color: var(--text-muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 32px 0 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .card {
    background: var(--bg-0); border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .badge {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 17px; flex-shrink: 0;
  }
  .name { font-weight: 600; color: var(--text-strong); }
  .desc { font-size: 13px; color: var(--text-muted); min-height: 34px; }

  button {
    border: none; border-radius: 8px; padding: 8px 12px;
    font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .add { background: #5865F2; color: #fff; }
  .add:hover { background: #4752c4; }
  .add.personal { background: var(--personal-bg); color: var(--personal-text); }
  .add.personal:hover { background: var(--personal-hover); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btns button { white-space: nowrap; padding: 8px 6px; }
  .remove { background: transparent; color: #f23f43; }
  /* kaarten: versleepbaar, eigen websites met label en ✎ */
  .card { position: relative; }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: .4; }
  .card.drop-before { box-shadow: inset 3px 0 0 #5865F2; }
  .card.drop-after { box-shadow: inset -3px 0 0 #5865F2; }
  .badge img { width: 24px; height: 24px; border-radius: 5px; object-fit: contain; }
  .badge.has-icon { background: #fff !important; }
  .own { position: absolute; top: -9px; right: 12px; background: #f0b232; color: #1b1300; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .editbtn { width: 28px; height: 28px; padding: 0; border-radius: 7px; background: var(--bg-1); color: var(--text-muted); flex-shrink: 0; }
  .editbtn:hover { background: var(--bg-2); color: var(--text-strong); }
  .card.addown { border: 2px dashed var(--bg-3); background: transparent; align-items: center; justify-content: center; text-align: center; cursor: pointer; min-height: 150px; }
  .card.addown:hover { border-color: #5865F2; }
  .card.addown .plus { width: 44px; height: 44px; border-radius: 12px; background: var(--bg-0); display: grid; place-items: center; font-size: 26px; color: var(--text-strong); }
  .cathead { display: flex; align-items: baseline; gap: 12px; }
  .cathead h2 { flex: 1; }
  .linkbtn { background: none; padding: 0; color: var(--text-muted); font-size: 13px; }
  .linkbtn:hover { color: var(--text-strong); text-decoration: underline; }
  /* formulier eigen website */
  .field-label { display: block; font-size: 13px; color: var(--text-muted); margin: 14px 0 6px; }
  .restartbtn { background: #5865F2; color: #fff; padding: 7px 12px; margin-right: 12px; white-space: nowrap; }
  .ftabs { display: flex; gap: 4px; margin: 0 0 12px; padding: 4px; background: var(--bg-0); border-radius: 10px; overflow-x: auto; }
  .ftabs button { flex: 1; background: transparent; color: var(--text); padding: 8px 12px; border-radius: 7px; white-space: nowrap; font-weight: 500; }
  .ftabs button:hover { background: var(--bg-2); }
  .ftabs button.on { background: #5865F2; color: #fff; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; background: var(--bg-1); color: var(--text); padding: 9px; }
  .seg button.on { background: #5865F2; color: #fff; }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }
  .dots { display: flex; gap: 10px; align-items: center; }
  .dots button { width: 26px; height: 26px; border-radius: 50%; padding: 0; }
  .dots button.on { outline: 2px solid var(--text-strong); outline-offset: 2px; }
  .inc { display: flex; align-items: center; gap: 14px; margin-top: 16px; background: var(--bg-1); border-radius: 10px; padding: 12px 14px; }
  .inc .text { flex: 1; } .inc .name { font-size: 14px; } .inc .desc { min-height: 0; margin-top: 2px; }
  .sheet .foot { display: flex; align-items: center; gap: 8px; margin: 18px 0 12px; }
  .sheet .foot .grow { flex: 1; }
  .site-icon { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; object-fit: contain; background: #fff; }
  .urlwrap { display: flex; align-items: center; gap: 10px; }
  .urlwrap .ask-input { margin: 0; }
  .svcrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--bg-1); }
  .svcrow:last-child { border-bottom: none; }
  .svcrow .name { flex: 1; }
  .remove:hover { background: var(--danger-bg); }

  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-0); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .row .name { flex: 1; }
  .row .sleepsw { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); margin-right: 8px; }
  select { background: var(--bg-1); color: var(--text); border: 1px solid var(--bg-3); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; }
  .empty { color: var(--text-muted); background: var(--bg-0); border-radius: 10px; padding: 16px; }

  .feature { display: flex; align-items: center; gap: 16px; background: var(--bg-0); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; }
  .feature .text { flex: 1; }
  .feature .desc { min-height: 0; margin-top: 2px; }
  .soon { font-size: 11px; color: var(--text-muted); border: 1px solid var(--bg-3); border-radius: 6px; padding: 2px 6px; margin-left: 8px; }

  header { display: flex; align-items: flex-start; gap: 16px; }
  header .titles { flex: 1; }
  .ghost { background: var(--bg-0); color: var(--text); display: flex; align-items: center; gap: 8px; }
  .ghost:hover { background: var(--bg-2); }
  .card .top .name { flex: 1; }
  .card .name u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .about { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--bg-0); border-radius: 10px; padding: 14px 16px; }
  .about .text { flex: 1; min-width: 200px; }
  .about .ver { color: var(--text-strong); font-weight: 600; }
  .about .donate { background: none; border: none; padding: 0; margin-top: 4px; font: inherit; font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .about .donate:hover { color: #db61a2; text-decoration: underline; }
  .about .st { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .dndrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--bg-0); border-radius: 10px; padding: 12px 16px; }
  .dndrow .status { flex: 1 1 100%; color: var(--text-muted); font-size: 14px; margin-bottom: 4px; }
  .dndrow .status b { color: var(--dnd-text); font-weight: 600; }
  .dndbtn { background: var(--bg-1); color: var(--text); }
  .dndbtn:hover { background: var(--bg-2); }
  .dndbtn.off { background: transparent; color: #f23f43; }
  h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  kbd { background: var(--bg-1); border: 1px solid var(--bg-3); border-bottom-width: 2px; border-radius: 5px; padding: 1px 7px; font-family: inherit; font-size: 13px; color: var(--text); }

  /* sneltoetsen-venster */
  .wn-sub { color: var(--text-muted); margin: 4px 0 4px; font-size: 14px; }
  .wn-list { margin: 0; padding-left: 20px; color: var(--text); line-height: 1.6; font-size: 14px; }
  .wn-foot { display: flex; justify-content: flex-end; margin: 20px 0 12px; }
  .about .links { display: flex; gap: 14px; margin-top: 4px; }
  .about .links .donate { margin-top: 0; }
  #modal, #wn, #ask, #site, #svcs { position: fixed; inset: 0; background: var(--backdrop); display: none; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; }
  #modal.open, #wn.open, #ask.open, #site.open, #svcs.open { display: flex; }
  /* adres vragen (Brightspace van je school) */
  .ask-input { width: 100%; margin: 14px 0 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--bg-3); background: var(--bg-1); color: var(--text); font: inherit; font-size: 15px; }
  .ask-input:focus { outline: 2px solid #5865F2; border-color: transparent; }
  .ask-err { color: #f23f43; font-size: 13px; min-height: 18px; }
  /* adresveld in de instellingen, met vinkje */
  .urlbox { width: 320px; flex-shrink: 0; }
  .urlbox .ask-input { margin: 0; font-size: 14px; padding: 8px 10px; }
  .urlstatus { font-size: 13px; min-height: 18px; margin-top: 5px; color: var(--text-muted); }
  .urlstatus.ok { color: #23a55a; } .urlstatus.bad { color: #f23f43; } .urlstatus.warn { color: #d99a1e; }
  .feature.flash { box-shadow: 0 0 0 2px #5865F2; transition: box-shadow .3s; }
  .ask-foot { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0 12px; }
  .sheet { background: var(--bg-0); border-radius: 14px; width: min(640px, 100%); padding: 24px 24px 12px; box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  .sheet-head { display: flex; align-items: center; margin-bottom: 4px; }
  .sheet-head h3 { flex: 1; margin: 0; color: var(--text-strong); font-size: 20px; }
  .close { background: transparent; color: var(--text-muted); font-size: 20px; padding: 4px 10px; }
  .close:hover { background: var(--bg-2); color: var(--text-strong); }
  .sheet h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 20px 0 6px; }
  .key { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--bg-1); color: var(--text-muted); font-size: 14px; }
  .key:last-child { border-bottom: none; }
  .key span:first-child { color: var(--text); }
  .key .combo { white-space: nowrap; }

  /* schakelaar */
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--slider-off); border-radius: 24px; cursor: pointer; transition: .15s; }
  .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: #23a55a; }
  input:checked + .slider::before { transform: translateX(18px); }
  input:disabled + .slider { opacity: .4; cursor: not-allowed; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 5px; border: 2px solid var(--bg-1); }
  ::-webkit-scrollbar-thumb:hover { background: var(--bg-3); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
<script src="mock.js"></script>
</head>
<body>
<main>
  <header>
    <div class="titles">
      <h1>Tabchat</h1>
      <p class="sub"><span data-i18n="home.subBefore"></span> <kbd>Ctrl</kbd> + <kbd>K</kbd> <span data-i18n="home.subAfter"></span></p>
    </div>
    <button class="ghost" id="openKeys" data-i18n="home.allKeys"></button>
  </header>

  <h2 data-i18n="home.mine"></h2>
  <div id="mine"></div>

  <div class="cathead">
    <h2><span data-i18n="home.add"></span> <span class="hint" data-i18n="home.addHint"></span></h2>
    <button class="linkbtn" id="chooseSvc" data-i18n="home.chooseSvc"></button>
  </div>
  <div class="grid" id="catalog"></div>

  <h2><span data-i18n="home.dnd"></span> <span class="hint" data-i18n="home.dndHint"></span></h2>
  <div class="dndrow" id="dndrow"></div>

  <h2 data-i18n="home.features"></h2>
  <div class="ftabs" id="featTabs"></div>
  <div id="features"></div>

  <h2 data-i18n="home.about"></h2>
  <div class="about" id="about"></div>

</main>

<div id="modal">
  <div class="sheet" role="dialog">
    <div class="sheet-head"><h3 data-i18n="keys.title"></h3><button class="close" id="closeKeys" data-i18n-title="keys.close">✕</button></div>
    <div id="keylist"></div>
  </div>
</div>

<div id="wn">
  <div class="sheet" role="dialog">
    <div class="sheet-head"><h3 data-i18n="wn.title"></h3><button class="close" id="closeWn" data-i18n-title="keys.close">✕</button></div>
    <p class="wn-sub" id="wnSub"></p>
    <div id="wnList"></div>
    <div class="wn-foot"><button class="add" id="okWn" data-i18n="wn.ok"></button></div>
  </div>
</div>

<div id="ask">
  <div class="sheet" role="dialog">
    <div class="sheet-head"><h3 id="askTitle"></h3><button class="close" id="closeAsk" data-i18n-title="keys.close">✕</button></div>
    <p class="wn-sub" id="askText"></p>
    <input class="ask-input" id="askInput" type="url" autocomplete="url" spellcheck="false">
    <div class="urlstatus" id="askStatus"></div>
    <div class="ask-err" id="askErr"></div>
    <div class="ask-foot"><button class="dndbtn" id="askCancel" data-i18n="ask.cancel"></button><button class="add" id="askOk" data-i18n="ask.add"></button></div>
  </div>
</div>

<div id="site">
  <div class="sheet" role="dialog">
    <div class="sheet-head"><h3 id="siteTitle"></h3><button class="close" id="siteClose" data-i18n-title="keys.close">✕</button></div>
    <p class="wn-sub" data-i18n="site.sub"></p>
    <label class="field-label" for="siteName" data-i18n="site.name"></label>
    <input class="ask-input" id="siteName" data-i18n-placeholder="site.namePh" maxlength="30" style="margin:0">
    <label class="field-label" for="siteUrl" data-i18n="site.url"></label>
    <div class="urlwrap"><img class="site-icon" id="siteIcon" alt="" hidden><input class="ask-input" id="siteUrl" type="url" spellcheck="false" data-i18n-placeholder="site.urlPh"></div>
    <div class="urlstatus" id="siteStatus"></div>
    <label class="field-label" data-i18n="site.signin"></label>
    <div class="seg" id="siteLogin"><button data-v="own" data-i18n="site.own"></button><button data-v="school" data-i18n="site.school"></button></div>
    <label class="field-label" data-i18n="site.color"></label>
    <div class="dots" id="siteColors"></div>
    <div class="inc" id="siteInc">
      <div class="text"><div class="name" data-i18n="site.incognito"></div><div class="desc" data-i18n="site.incognitoDesc"></div></div>
      <label class="switch"><input type="checkbox" id="siteTemp"><span class="slider"></span></label>
    </div>
    <div class="foot">
      <button class="remove" id="siteDelete" data-i18n="site.delete"></button>
      <span class="grow"></span>
      <button class="dndbtn" id="siteCancel" data-i18n="ask.cancel"></button>
      <button class="add" id="siteOk"></button>
    </div>
  </div>
</div>

<div id="svcs">
  <div class="sheet" role="dialog">
    <div class="sheet-head"><h3 data-i18n="svc.title"></h3><button class="close" id="svcsClose" data-i18n-title="keys.close">✕</button></div>
    <p class="wn-sub" data-i18n="svc.sub"></p>
    <div id="svcList"></div>
    <div class="wn-foot"><button class="add" id="svcsOk" data-i18n="svc.done"></button></div>
  </div>
</div>

<script>
  // ---------- vertalingen (zie src/main/i18n.js) ----------
  let L = {};
  let curLang = null;
  const T = (k, v = {}) => {
    let s = L[k] ?? k;
    for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(b);
    return s;
  };
  async function loadStrings(lang) {
    if (lang && lang === curLang) return;
    const r = await window.tabchat.getStrings();
    L = r.strings;
    curLang = r.lang;
    document.documentElement.lang = r.lang;
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = T(e.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(e => { e.placeholder = T(e.dataset.i18nPlaceholder); });
  }

  // Functies: de teksten staan in i18n.js onder f.<key>.name en f.<key>.desc.
  // options = keuzelijst in plaats van schakelaar.
  const FEATURES = [
    { group: 'general', key: 'language', options: [['auto', 'f.language.auto'], ['nl', '!Nederlands'], ['en', '!English']] },
    { group: 'general', key: 'theme', options: [['system', 'f.theme.system'], ['dark', 'f.theme.dark'], ['light', 'f.theme.light']] },
    { group: 'general', key: 'tabBar', options: [['normal', 'f.tabBar.normal'], ['compact', 'f.tabBar.compact'], ['autohide', 'f.tabBar.autohide']] },
    { group: 'general', key: 'openLinks', options: 'links' }, // lijst hangt af van de browsers op deze computer
    { group: 'general', key: 'spellcheck' },
    { group: 'general', key: 'hardwareAcceleration' },
    { group: 'accounts', key: 'stayLoggedIn' },
    { group: 'accounts', key: 'shareMicrosoft' },
    { group: 'accounts', key: 'brightspaceUrl', type: 'url' },
    { group: 'notify', key: 'unreadBadges' },
    { group: 'notify', key: 'followSystemDnd', hideInStore: true },
    { group: 'notify', key: 'whiteTray' },
    { group: 'startup', key: 'autostart', hideInStore: true },
    { group: 'startup', key: 'runInBackground' },
    { group: 'startup', key: 'autoUpdate', hideInStore: true },
    { group: 'memory', key: 'sleepEnabled' },
    { group: 'memory', key: 'sleepMinutes', options: [[15, 'f.sleepMinutes.15'], [30, 'f.sleepMinutes.30'], [60, 'f.sleepMinutes.60']] },
    { group: 'memory', key: 'sleepOnStart' }
  ];
  // Functies verdeeld over tabjes; het laatst gekozen tabje onthouden we
  const FEATURE_TABS = ['general', 'accounts', 'notify', 'startup', 'memory'];
  let featTab = 'general';
  try { if (FEATURE_TABS.includes(localStorage.getItem('featTab'))) featTab = localStorage.getItem('featTab'); } catch {}

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  const badge = (name, color) => {
    const b = el('div', 'badge', name[0]);
    b.style.background = color;
    return b;
  };

  // Naam met de sneltoets-letter onderstreept, bv. O<u>n</u>eDrive
  function nameWithKey(name, key) {
    const div = el('div', 'name');
    const i = key ? name.toLowerCase().indexOf(key) : -1; // geen sneltoets: niets onderstrepen
    if (i < 0) { div.textContent = name; return div; }
    div.append(name.slice(0, i), el('u', null, name[i]), name.slice(i + 1));
    return div;
  }

  // ---------- sneltoetsen-venster ----------
  const KEYS = [
    ['keys.general', [
      [['Ctrl', 'K'], 'keys.search'],
      [['Alt', 'T'], 'keys.home'],
      [['Esc'], 'keys.back'],
      [['Alt', 'W / D / T / O / N / B'], 'keys.addLetter'],
      [['F11'], 'keys.fullscreen'],
      [['Ctrl', 'Q'], 'keys.quit']
    ]],
    ['keys.tabs', [
      [['Alt', '1 – 8'], 'keys.goto'],
      [['Alt', '9'], 'keys.last'],
      [['Ctrl', 'Tab'], 'keys.next'],
      [['Ctrl', 'Shift', 'Tab'], 'keys.prev'],
      [['Ctrl', 'W'], 'keys.close2'],
      [['Ctrl', 'Shift', 'T'], 'keys.reopen'],
      [['Ctrl', 'Shift', 'PageUp / PageDown'], 'keys.move']
    ]],
    ['keys.inTab', [
      [['F5'], 'keys.reload'],
      [['Alt', 'M'], 'keys.mute'],
      [['Alt', '← / →'], 'keys.nav'],
      [['Ctrl', '+'], 'keys.zoomIn'],
      [['Ctrl', '−'], 'keys.zoomOut'],
      [['Ctrl', '0'], 'keys.zoomReset']
    ]]
  ];

  function buildKeys() {
    const box = document.getElementById('keylist');
    box.replaceChildren();
    for (const [group, rows] of KEYS) {
      box.append(el('h4', null, T(group)));
      for (const [combo, what] of rows) {
        const row = el('div', 'key');
        const c = el('span', 'combo');
        combo.forEach((k, i) => {
          if (i) c.append(' + ');
          c.append(el('kbd', null, k));
        });
        row.append(el('span', null, T(what)), c);
        box.append(row);
      }
    }
    const tip = el('div', 'key');
    tip.append(el('span', null, T('keys.tip')));
    box.append(tip);
  }

  const modal = document.getElementById('modal');
  const openKeys = () => modal.classList.add('open');
  const closeKeys = () => modal.classList.remove('open');
  document.getElementById('openKeys').onclick = openKeys;
  document.getElementById('closeKeys').onclick = closeKeys;
  modal.onclick = (e) => { if (e.target === modal) closeKeys(); };
  window.tabchat.onShowShortcuts(openKeys);

  // ---------- Wat is er nieuw ----------
  const wn = document.getElementById('wn');
  const closeWn = () => { if (!wn.classList.contains('open')) return; wn.classList.remove('open'); window.tabchat.whatsNewClosed(); };
  document.getElementById('closeWn').onclick = closeWn;
  document.getElementById('okWn').onclick = closeWn;
  wn.onclick = (e) => { if (e.target === wn) closeWn(); };
  window.tabchat.onWhatsNew(async (d) => {
    await loadStrings(); // taal kan veranderd zijn
    closeKeys();
    document.getElementById('wnSub').textContent = d.updated ? T('wn.updated', { v: d.current }) : '';
    const list = document.getElementById('wnList');
    list.replaceChildren();
    for (const e of d.entries) {
      list.append(el('h4', null, T('wn.version', { v: e.v })));
      const ul = el('ul', 'wn-list');
      for (const item of e.items) ul.append(el('li', null, item));
      list.append(ul);
    }
    wn.classList.add('open');
    document.getElementById('okWn').focus();
  });

  // ---------- adres controleren (groen vinkje als het een werkende Brightspace is) ----------
  const URL_STATUS = { checking: 'busy', ok: 'ok', notBrightspace: 'warn', notFound: 'bad', invalid: 'bad', error: 'warn' };
  function showStatus(elStatus, status) {
    elStatus.className = 'urlstatus' + (status ? ' ' + URL_STATUS[status] : '');
    elStatus.textContent = status ? T('url.' + status) : '';
  }
  async function checkUrl(value, elStatus) {
    if (!value.trim()) { showStatus(elStatus, ''); return { status: 'empty' }; }
    showStatus(elStatus, 'checking');
    let res;
    try { res = await window.tabchat.checkUrl(value); } catch { res = { status: 'error', url: value }; }
    showStatus(elStatus, res.status);
    return res;
  }
  // Mag dit adres bewaard worden? Bestaat het niet of is het geen adres, dan niet.
  const savable = (res) => res.status === 'ok' || res.status === 'notBrightspace' || res.status === 'error';

  // ---------- adres vragen (dienst waarvan het adres per school verschilt, bv. Brightspace) ----------
  const ask = document.getElementById('ask');
  const askInput = document.getElementById('askInput');
  const askErr = document.getElementById('askErr');
  let askService = null;
  const looksLikeUrl = (v) => /^(https?:\/\/)?[^\s/]+\.[^\s/]{2,}(\/\S*)?$/i.test(v.trim());
  function openAsk(service) {
    askService = service;
    document.getElementById('askTitle').textContent = T(`ask.${service}.title`);
    document.getElementById('askText').textContent = T(`ask.${service}.text`);
    askInput.placeholder = T(`ask.${service}.placeholder`);
    askInput.value = '';
    askErr.textContent = '';
    showStatus(document.getElementById('askStatus'), '');
    closeKeys();
    ask.classList.add('open');
    askInput.focus();
  }
  const closeAsk = () => ask.classList.remove('open');
  async function submitAsk() {
    if (!looksLikeUrl(askInput.value)) { askErr.textContent = T('ask.invalid'); askInput.focus(); return; }
    const res = await checkUrl(askInput.value, document.getElementById('askStatus'));
    if (!savable(res)) { askInput.focus(); return; }
    window.tabchat.add(askService, res.url || askInput.value.trim());
    closeAsk();
  }
  let askTimer = null;
  askInput.addEventListener('input', () => {
    clearTimeout(askTimer);
    askTimer = setTimeout(() => { if (looksLikeUrl(askInput.value)) checkUrl(askInput.value, document.getElementById('askStatus')); }, 700);
  });
  document.getElementById('askOk').onclick = submitAsk;
  document.getElementById('askCancel').onclick = closeAsk;
  document.getElementById('closeAsk').onclick = closeAsk;
  askInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAsk(); });
  askInput.addEventListener('input', () => { askErr.textContent = ''; });
  ask.onclick = (e) => { if (e.target === ask) closeAsk(); };
  window.tabchat.onAskUrl(openAsk);

  // ---------- kaarten in het +-scherm: volgorde, verbergen, eigen websites ----------
  let lastState = null;
  const hiddenSet = (s) => new Set((s.settings && s.settings.hiddenServices) || []);
  function visibleCards(s) {
    const hidden = hiddenSet(s);
    const order = (s.settings && s.settings.cardOrder) || [];
    const cards = s.catalog.filter(c => !c.base && !hidden.has(c.id));
    const pos = (c, i) => { const k = order.indexOf(c.id); return k < 0 ? 1000 + i : k; };
    return cards.map((c, i) => [c, pos(c, i)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  }
  function iconBadge(c) {
    const b = el('div', 'badge has-icon');
    const img = document.createElement('img');
    img.src = c.icon;
    img.alt = '';
    img.onerror = () => { b.replaceWith(badge(c.name, c.color)); };
    b.append(img);
    return b;
  }

  // Slepen om de volgorde van de kaarten te veranderen
  let dragCard = null;
  function makeDraggable(card, id) {
    card.draggable = true;
    card.ondragstart = (e) => { dragCard = id; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); };
    card.ondragend = () => { dragCard = null; card.classList.remove('dragging'); clearCardDrop(); };
    card.ondragover = (e) => {
      if (!dragCard || dragCard === id) return;
      e.preventDefault();
      const r = card.getBoundingClientRect();
      clearCardDrop();
      card.classList.add(e.clientX > r.left + r.width / 2 ? 'drop-after' : 'drop-before');
    };
    card.ondragleave = () => card.classList.remove('drop-before', 'drop-after');
    card.ondrop = (e) => {
      e.preventDefault();
      if (!dragCard || dragCard === id || !lastState) return;
      const after = card.classList.contains('drop-after');
      clearCardDrop();
      const ids = visibleCards(lastState).map(c => c.id).filter(x => x !== dragCard);
      ids.splice(ids.indexOf(id) + (after ? 1 : 0), 0, dragCard);
      window.tabchat.setSetting('cardOrder', ids);
    };
  }
  function clearCardDrop() {
    document.querySelectorAll('.card.drop-before, .card.drop-after').forEach(c => c.classList.remove('drop-before', 'drop-after'));
  }

  // ---------- diensten kiezen (vaste diensten tonen/verbergen) ----------
  const svcs = document.getElementById('svcs');
  function openSvcs() {
    if (!lastState) return;
    const list = document.getElementById('svcList');
    list.replaceChildren();
    const hidden = hiddenSet(lastState);
    for (const c of lastState.catalog.filter(c => !c.base && !c.custom)) {
      const row = el('div', 'svcrow');
      const sw = el('label', 'switch');
      const inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = !hidden.has(c.id);
      inp.onchange = () => {
        const h = hiddenSet(lastState);
        if (inp.checked) h.delete(c.id); else h.add(c.id);
        window.tabchat.setSetting('hiddenServices', [...h]);
      };
      sw.append(inp, el('span', 'slider'));
      row.append(c.icon ? iconBadge(c) : badge(c.name, c.color), el('div', 'name', c.name), sw);
      list.append(row);
    }
    svcs.classList.add('open');
  }
  const closeSvcs = () => svcs.classList.remove('open');
  document.getElementById('chooseSvc').onclick = openSvcs;
  document.getElementById('svcsClose').onclick = closeSvcs;
  document.getElementById('svcsOk').onclick = closeSvcs;
  svcs.onclick = (e) => { if (e.target === svcs) closeSvcs(); };

  // ---------- eigen website toevoegen / wijzigen ----------
  const COLORS = ['#5865F2', '#25D366', '#E8642C', '#0078D4', '#E5484D', '#A855F7', '#F0B232', '#4E5058'];
  const site = document.getElementById('site');
  const siteName = document.getElementById('siteName');
  const siteUrl = document.getElementById('siteUrl');
  const siteStatus = document.getElementById('siteStatus');
  const siteIcon = document.getElementById('siteIcon');
  const siteTemp = document.getElementById('siteTemp');
  const SITE_STATUS = { checking: 'busy', ok: 'ok', google: 'warn', notFound: 'bad', invalid: 'bad', error: 'warn' };
  let siteEdit = null, siteColor = COLORS[0], siteSchool = false, siteCheck = null, siteTimer = null, siteSeq = 0;

  function showSiteStatus(status) {
    siteStatus.className = 'urlstatus' + (status ? ' ' + SITE_STATUS[status] : '');
    siteStatus.textContent = status ? T('site.' + status) : '';
  }
  function setIcon(src) { siteIcon.hidden = !src; if (src) siteIcon.src = src; }
  function drawColors() {
    const box = document.getElementById('siteColors');
    box.replaceChildren();
    for (const c of COLORS) {
      const b = document.createElement('button');
      b.style.background = c;
      b.className = c === siteColor ? 'on' : '';
      b.onclick = () => { siteColor = c; drawColors(); };
      box.append(b);
    }
  }
  function drawLogin() {
    document.querySelectorAll('#siteLogin button').forEach(b => {
      b.classList.toggle('on', (b.dataset.v === 'school') === siteSchool);
      b.disabled = siteTemp.checked; // incognito heeft altijd een eigen, tijdelijke login
    });
  }
  document.querySelectorAll('#siteLogin button').forEach(b => { b.onclick = () => { siteSchool = b.dataset.v === 'school'; drawLogin(); }; });
  siteTemp.onchange = () => {
    if (siteTemp.checked) siteSchool = false;
    drawLogin();
    document.getElementById('siteOk').textContent = T(siteTemp.checked ? 'site.open' : 'site.add');
  };

  async function runSiteCheck() {
    const v = siteUrl.value.trim();
    if (!v) { showSiteStatus(''); setIcon(null); siteCheck = null; return null; }
    const seq = ++siteSeq;
    showSiteStatus('checking');
    let res;
    try { res = await window.tabchat.checkSite(v); } catch { res = { status: 'error', url: v }; }
    if (seq !== siteSeq) return null; // intussen verder getypt
    siteCheck = res;
    showSiteStatus(res.status);
    setIcon(res.icon || null);
    if (res.title && !siteName.value.trim()) siteName.value = res.title;
    return res;
  }
  siteUrl.addEventListener('input', () => {
    siteCheck = null;
    clearTimeout(siteTimer);
    siteTimer = setTimeout(() => { if (looksLikeUrl(siteUrl.value)) runSiteCheck(); }, 700);
  });

  function openSite(c) {
    siteEdit = c;
    document.getElementById('siteTitle').textContent = T(c ? 'site.editTitle' : 'site.addTitle');
    siteName.value = c ? c.name : '';
    siteUrl.value = c ? c.url : '';
    siteColor = c ? c.color : COLORS[0];
    siteSchool = c ? !!c.school : false;
    siteTemp.checked = false;
    siteCheck = c ? { status: 'ok', url: c.url, icon: c.icon } : null;
    setIcon(c ? c.icon : null);
    showSiteStatus('');
    document.getElementById('siteInc').style.display = c ? 'none' : '';
    document.getElementById('siteDelete').style.display = c ? '' : 'none';
    document.getElementById('siteOk').textContent = T(c ? 'site.save' : 'site.add');
    drawColors();
    drawLogin();
    closeKeys();
    site.classList.add('open');
    (c ? siteName : siteUrl).focus();
  }
  const closeSite = () => site.classList.remove('open');

  async function submitSite() {
    if (!looksLikeUrl(siteUrl.value)) { showSiteStatus('invalid'); siteUrl.focus(); return; }
    const res = siteCheck && siteCheck.url ? siteCheck : await runSiteCheck();
    if (!res || res.status === 'notFound' || res.status === 'invalid') { siteUrl.focus(); return; }
    let host = '';
    try { host = new URL(res.url).hostname.replace(/^www\./, ''); } catch {}
    const data = { name: siteName.value.trim() || res.title || host, url: res.url, color: siteColor, icon: res.icon || null, school: siteSchool };
    if (siteEdit) window.tabchat.updateCustom(siteEdit.id, data);
    else window.tabchat.addCustom(data, siteTemp.checked);
    closeSite();
  }
  document.getElementById('siteOk').onclick = submitSite;
  document.getElementById('siteCancel').onclick = closeSite;
  document.getElementById('siteClose').onclick = closeSite;
  document.getElementById('siteDelete').onclick = () => {
    if (!siteEdit) return;
    if (confirm(T('site.deleteConfirm', { name: siteEdit.name }))) { window.tabchat.removeCustom(siteEdit.id); closeSite(); }
  };
  siteUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitSite(); });
  siteName.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitSite(); });
  site.onclick = (e) => { if (e.target === site) closeSite(); };

  // Esc: eerst het venster sluiten, anders terug naar je tabblad
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (site.classList.contains('open')) closeSite();
    else if (svcs.classList.contains('open')) closeSvcs();
    else if (ask.classList.contains('open')) closeAsk();
    else if (wn.classList.contains('open')) closeWn();
    else if (modal.classList.contains('open')) closeKeys();
    else window.tabchat.back();
  });

  function render(s) {
    // Jouw tabbladen
    const mine = document.getElementById('mine');
    mine.replaceChildren();
    if (s.tabs.length === 0) {
      mine.append(el('div', 'empty', T('home.empty')));
    }
    for (const t of s.tabs) {
      const row = el('div', 'row');
      const rm = el('button', 'remove', T('home.remove'));
      rm.onclick = () => {
        if (confirm(T('home.removeConfirm', { name: t.label }))) window.tabchat.remove(t.id);
      };
      // Mag dit tabblad in slaapstand?
      const sw = el('label', 'sleepsw');
      const swBox = el('span', 'switch');
      const inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = t.canSleep;
      inp.onchange = () => window.tabchat.setTabSleep(t.id, inp.checked);
      swBox.append(inp, el('span', 'slider'));
      sw.append(T(t.asleep ? 'home.asleepMaySleep' : 'home.maySleep'), swBox);
      sw.title = T('home.sleepTitle');
      const icon = (s.catalog.find(c => c.id === t.service) || {}).icon; // logo van de dienst, als die gevonden is
      row.append(icon ? iconBadge({ name: t.label, color: t.color, icon }) : badge(t.label, t.color), el('div', 'name', t.fullLabel || t.label), sw, rm);
      mine.append(row);
    }

    // Dienst toevoegen
    const cat = document.getElementById('catalog');
    cat.replaceChildren();
    lastState = s;
    for (const c of visibleCards(s)) {
      const personal = s.catalog.find(x => x.base === c.id);
      const card = el('div', 'card');
      const top = el('div', 'top');
      top.append(c.icon ? iconBadge(c) : badge(c.name, c.color), nameWithKey(c.name, c.key));
      if (c.custom) {
        // Eigen website: label "Eigen" en ✎ om te wijzigen of te verwijderen
        card.append(el('span', 'own', T('own.badge')));
        const ed = el('button', 'editbtn', '✎');
        ed.title = T('own.edit');
        ed.onclick = (e) => { e.stopPropagation(); openSite(c); };
        top.append(ed);
      }
      card.append(top, el('div', 'desc', c.desc));
      makeDraggable(card, c.id);
      if (personal) {
        // Microsoft: school/werk en privé zijn aparte websites met een eigen login
        const btns = el('div', 'btns');
        const work = el('button', 'add', T('home.addWork'));
        work.title = T('home.addWorkTitle', { k: ' · Alt+' + c.key.toUpperCase() });
        work.onclick = () => window.tabchat.add(c.id);
        const priv = el('button', 'add personal', T('home.addPersonal'));
        priv.title = T('home.addPersonalTitle');
        priv.onclick = () => window.tabchat.add(personal.id);
        btns.append(work, priv);
        card.append(btns);
      } else {
        if (c.key) card.title = T('home.addTitle', { k: c.key.toUpperCase() });
        const add = el('button', 'add', T('home.addBtn'));
        add.onclick = () => window.tabchat.add(c.id); // adres nodig en nog niet bekend? Dan vraagt de app erom
        card.append(add);
      }
      cat.append(card);
    }
    // Laatste kaart: zelf een website toevoegen
    const own = el('div', 'card addown');
    own.append(el('div', 'plus', '+'), el('div', 'name', T('own.card')), el('div', 'desc', T('own.cardDesc')));
    own.onclick = () => openSite(null);
    cat.append(own);
    // Kolommen: zo gelijk mogelijk over twee rijen, maximaal 4 naast elkaar (5 kaarten = 3 + 2, 7 = 4 + 3)
    const n = cat.children.length;
    const cols = n <= 2 ? n : Math.min(4, Math.ceil(n / 2));
    cat.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

    // Over Tabchat / updates
    const about = document.getElementById('about');
    about.replaceChildren();
    const u = s.update || {};
    const info = el('div', 'text');
    const st = u.state ? T('upd.' + u.state, { v: u.version, p: u.percent || 0, s: u.store }) : '';
    const don = el('button', 'donate', T('don.link'));
    don.onclick = () => window.tabchat.openDonate();
    const news = el('button', 'donate', T('wn.link'));
    news.onclick = () => window.tabchat.openWhatsNew();
    const fb = el('button', 'donate', T('fb.link'));
    fb.onclick = () => window.tabchat.openFeedback();
    const links = el('div', 'links');
    links.append(news, fb, don);
    info.append(el('div', 'ver', `Tabchat ${u.current || ''}`), el('div', 'st', st), links);
    about.append(info);
    if (u.state === 'ready' || u.state === 'failed') {
      const ib = el('button', 'add', T('upd.install'));
      ib.onclick = () => window.tabchat.installUpdate();
      about.append(ib);
    } else if (u.state !== 'dev' && u.state !== 'store' && u.state !== 'downloading' && u.state !== 'checking') {
      const cb = el('button', 'dndbtn', T('upd.check'));
      cb.onclick = () => window.tabchat.checkUpdate();
      about.append(cb);
    }

    // Niet storen
    const dr = document.getElementById('dndrow');
    dr.replaceChildren();
    const status = el('div', 'status');
    if (s.dnd.on) status.append(T('dnd.on') + ' ', el('b', null, s.dnd.label));
    else status.textContent = T('dnd.off');
    dr.append(status);
    const btn = (text, mode, cls = 'dndbtn') => {
      const b = el('button', cls, text);
      b.onclick = () => window.tabchat.setDnd(mode);
      dr.append(b);
    };
    btn(T('dnd.1h'), 60);
    btn(T('dnd.tomorrow'), 'tomorrow');
    btn(T('dnd.forever'), 'forever');
    if (s.dnd.manual) btn(T('dnd.turnOff'), null, 'dndbtn off');

    // Functies
    const feat = document.getElementById('features');
    feat.replaceChildren();
    const ftabs = document.getElementById('featTabs');
    ftabs.replaceChildren();
    for (const g of FEATURE_TABS) {
      const b = el('button', g === featTab ? 'on' : '', T('ftab.' + g));
      b.onclick = () => { featTab = g; try { localStorage.setItem('featTab', g); } catch {} render(s); };
      ftabs.append(b);
    }
    for (const f of FEATURES) {
      if (f.group !== featTab) continue;
      if (f.hideInStore && s.platform && s.platform.storeManaged) continue; // Flathub/Snap regelt dit zelf
      if (f.type === 'url') {
        if (f.key === 'brightspaceUrl' && hiddenSet(s).has('brightspace')) continue; // Brightspace verborgen
        feat.append(urlRow(f, s));
        continue;
      }
      const row = el('div', 'feature');
      const text = el('div', 'text');
      const title = el('div', 'name', T(`f.${f.key}.name`));
      text.append(title, el('div', 'desc', T(`f.${f.key}.desc`)));

      // Keuzelijst in plaats van schakelaar
      if (f.options) {
        const sel = document.createElement('select');
        const opts = f.options === 'links'
          ? [['default', 'f.openLinks.default'], ...(s.browsers || []).map(b => [b.id, '!' + b.name]), ['internal', 'f.openLinks.internal']]
          : f.options;
        for (const [value, label] of opts) {
          // '!Tekst' = niet vertalen (taalnamen staan altijd in hun eigen taal)
          const o = el('option', null, label.startsWith('!') ? label.slice(1) : T(label));
          o.value = value;
          if (String(s.settings[f.key]) === String(value)) o.selected = true;
          sel.append(o);
        }
        const numeric = typeof opts[0][0] === 'number';
        sel.onchange = () => window.tabchat.setSetting(f.key, numeric ? Number(sel.value) : sel.value);
        row.append(text, sel);
        feat.append(row);
        continue;
      }

      const label = el('label', 'switch');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!s.settings[f.key];
      input.onchange = () => window.tabchat.setSetting(f.key, input.checked);
      label.append(input, el('span', 'slider'));
      if (f.key === 'hardwareAcceleration' && s.restartNeeded) {
        // Werkt pas na opnieuw starten
        const rb = el('button', 'restartbtn', T('f.hardwareAcceleration.restart'));
        rb.onclick = () => window.tabchat.relaunch();
        row.append(text, rb, label);
      } else row.append(text, label);
      feat.append(row);
    }
  }

  // Instelling met een adres (Brightspace van je school): één keer gemaakt, zodat typen niet onderbroken wordt
  const urlRows = {};
  function urlRow(f, s) {
    const saved = s.settings[f.key] || '';
    let r = urlRows[f.key];
    if (r && r.lang === curLang) {
      if (document.activeElement !== r.input && r.input.value !== saved && saved) { r.input.value = saved; checkUrl(saved, r.status); }
      return r.row;
    }
    const row = el('div', 'feature');
    const text = el('div', 'text');
    text.append(el('div', 'name', T(`f.${f.key}.name`)), el('div', 'desc', T(`f.${f.key}.desc`)));
    const box = el('div', 'urlbox');
    const input = document.createElement('input');
    input.className = 'ask-input';
    input.type = 'url';
    input.spellcheck = false;
    input.placeholder = T(`f.${f.key}.placeholder`);
    input.value = (r && r.input.value) || saved;
    const status = el('div', 'urlstatus');
    box.append(input, status);
    row.append(text, box);
    let timer = null;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const res = await checkUrl(input.value, status);
        if (res.status === 'empty') window.tabchat.setSetting(f.key, '');
        else if (savable(res)) window.tabchat.setSetting(f.key, res.url);
      }, 700);
    });
    r = urlRows[f.key] = { row, input, status, lang: curLang };
    if (input.value) checkUrl(input.value, status); // vinkje meteen tonen
    return row;
  }
  window.tabchat.onFocusSetting((key) => {
    const f = FEATURES.find(x => x.key === key);
    if (f && f.group !== featTab && lastState) { featTab = f.group; render(lastState); } // naar het juiste tabje
    const r = urlRows[key];
    if (!r) return;
    r.row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    r.input.focus();
    r.input.select();
    r.row.classList.add('flash');
    setTimeout(() => r.row.classList.remove('flash'), 1500);
  });

  // Bij een andere taal: vaste teksten en sneltoetsen opnieuw opbouwen
  const update = async (s) => {
    const before = curLang;
    await loadStrings(s.lang);
    if (curLang !== before) buildKeys();
    render(s);
  };
  window.tabchat.onState(update);
  window.tabchat.getState().then(update);
</script>
</body>
</html>
