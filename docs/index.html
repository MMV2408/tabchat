<style>
  :root {
    color-scheme: dark;
    --bg: #1b1320; --surface: #271d2e; --surface-2: #31253a; --line: #3a2e43;
    --text: #f4eff7; --muted: #b8acc3; --link: #c9b6ff; --code: #120d16;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'Atkinson Hyperlegible', system-ui, sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #faf7fc; --surface: #f0e9f5; --surface-2: #e6dcee; --line: #ddd2e5;
    --text: #1f1426; --muted: #5b4f66; --link: #5b3fc0; --code: #2a1f31;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; height: auto; display: block; }
  a { color: var(--link); }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 6px; }
  .wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }
  kbd { font: 700 .85em var(--body); background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }

  /* ---------- kop ---------- */
  header.top { display: flex; align-items: center; gap: 20px; padding: 20px 0; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font: 700 22px var(--display); margin-right: auto; }
  .brand img { width: 34px; height: 34px; }
  nav.top { display: flex; gap: 20px; }
  nav.top a { color: var(--muted); text-decoration: none; font-size: 16px; }
  nav.top a:hover { color: var(--text); }
  .tools { display: flex; gap: 6px; }
  .tool { background: transparent; color: var(--muted); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px; font: 700 14px var(--body); cursor: pointer; min-width: 40px; }
  .tool:hover { color: var(--text); border-color: var(--muted); }

  /* ---------- hero ---------- */
  .hero { padding: 40px 0 0; }
  .hero h1 { font: 800 clamp(40px, 6.4vw, 78px)/1.02 var(--display); letter-spacing: -0.02em; margin: 0 0 22px; max-width: 15ch; }
  .lead { font-size: 21px; color: var(--muted); max-width: 58ch; margin: 0 0 30px; }
  .get { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 20px; border-radius: 12px; font: 700 17px var(--body); text-decoration: none; cursor: pointer; border: 0; }
  .btn.primary { background: var(--text); color: var(--bg); }
  .btn.ghost { color: var(--text); border: 1.5px solid var(--line); background: transparent; }
  .btn.ghost:hover { border-color: var(--muted); }

  /* ---------- de simulatie: het herkenbare element ---------- */
  .try { margin: 56px 0 12px; color: var(--muted); font-size: 16px; }
  .try b { color: var(--text); }
  .simbox { position: relative; width: 100%; }
  .win { position: absolute; top: 0; left: 0; width: 1120px; transform-origin: 0 0; border-radius: 12px; overflow: hidden;
         box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06); background: #1e1f22; }
  .win.light { background: #fff; box-shadow: 0 30px 80px rgba(60,30,80,.18), 0 0 0 1px rgba(0,0,0,.08); }
  .titlebar { height: 38px; display: flex; align-items: center; justify-content: center; position: relative; background: #2a2a2e; color: #e8e8ea; font: 700 14px system-ui, sans-serif; }
  .win.light .titlebar { background: #ebebed; color: #2e2e33; }
  .titlebar .ctl { position: absolute; right: 12px; display: flex; gap: 14px; opacity: .75; font-size: 13px; }
  .tabsframe { display: block; width: 100%; height: 44px; border: 0; }
  .content { position: relative; height: 646px; background: #2b2d31; }
  .win.light .content { background: #f2f3f5; }
  .content > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .content img { object-fit: cover; object-position: top left; }
  .content [hidden] { display: none; }
  .placeholder { display: grid; place-content: center; justify-items: center; gap: 14px; color: #949ba4; font: 16px system-ui, sans-serif; }
  .placeholder .badge { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; color: #fff; font: 700 34px system-ui, sans-serif; }
  .placeholder strong { color: #dbdee1; font-size: 22px; }
  .win.light .placeholder strong { color: #313338; }
  .tabmenu { position: fixed; z-index: 10; min-width: 270px; padding: 6px; border-radius: 12px; background: #2e2e33; color: #f0f0f2;
             box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); font: 15px system-ui, sans-serif; }
  .tabmenu.light { background: #fff; color: #222; box-shadow: 0 12px 40px rgba(0,0,0,.2), 0 0 0 1px rgba(0,0,0,.08); }
  .tabmenu button { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
  .tabmenu button:hover:not(:disabled), .tabmenu button:focus-visible { background: rgba(127,127,140,.22); outline: none; }
  .tabmenu button:disabled { opacity: .4; cursor: default; }
  .tabmenu .chk { width: 14px; }
  .tabmenu .k { margin-left: auto; opacity: .55; font-size: 13px; }
  .tabmenu hr { border: 0; border-top: 1px solid rgba(127,127,140,.25); margin: 5px 4px; }
  .caption { color: var(--muted); font-size: 16px; margin: 18px 4px 0; min-height: 3.2em; max-width: 70ch; }

  /* ---------- secties ---------- */
  section { padding: 104px 0 0; }
  h2 { font: 800 clamp(30px, 4vw, 46px)/1.1 var(--display); letter-spacing: -0.015em; margin: 0 0 18px; max-width: 22ch; }
  .intro { color: var(--muted); max-width: 62ch; margin: 0 0 20px; }
  .intro strong { color: var(--text); }

  .why { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }
  .mem { display: grid; gap: 14px; }
  .mem .bar { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 14px; font-size: 16px; }
  .mem .track { height: 30px; border-radius: 8px; display: flex; overflow: hidden; background: var(--surface); }
  .mem .seg { height: 100%; }
  .mem .bar span { color: var(--muted); }
  .mem small { color: var(--muted); font-size: 14px; }

  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 44px 48px; margin-top: 36px; }
  .group h3 { font: 700 22px/1.25 var(--display); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  .group h3 i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
  .group ul { margin: 0; padding: 0; list-style: none; }
  .group li { padding: 9px 0; border-top: 1px solid var(--line); }
  .group li:last-child { border-bottom: 1px solid var(--line); }

  .split { display: grid; grid-template-columns: 1fr 230px; gap: 56px; align-items: start; }
  .split .tray { filter: drop-shadow(0 20px 40px rgba(0,0,0,.35)); }
  details.keys { margin-top: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  details.keys summary { cursor: pointer; padding: 14px 0; font-weight: 700; }
  .keytable { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 40px; padding-bottom: 18px; }
  .keytable h4 { font: 700 17px var(--display); margin: 14px 0 4px; }
  .keyrow { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .keyrow span:first-child { color: var(--muted); }

  .news { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .news article { background: var(--surface); border-radius: 16px; padding: 22px 24px; }
  .news h3 { font: 700 20px var(--display); margin: 0 0 8px; }
  .news ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 16px; }
  .news li + li { margin-top: 6px; }

  .privacy { background: var(--surface); border-radius: 22px; padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .privacy p { margin: 0 0 14px; }
  .privacy p:last-child { margin: 0; }

  .faq details { border-top: 1px solid var(--line); }
  .faq details:last-child { border-bottom: 1px solid var(--line); }
  .faq summary { cursor: pointer; padding: 18px 0; font: 700 19px var(--display); list-style: none; display: flex; justify-content: space-between; gap: 16px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: '+'; color: var(--muted); font-size: 24px; line-height: 1; }
  .faq details[open] summary::after { content: '−'; }
  .faq details p { margin: 0 0 20px; color: var(--muted); max-width: 70ch; }

  .install { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
  .way { background: var(--surface); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; }
  .way h3 { font: 700 22px var(--display); margin: 0 0 6px; }
  .way p { color: var(--muted); margin: 0 0 16px; font-size: 16px; }
  .way .btn { margin-top: auto; align-self: flex-start; }
  pre { margin: 0 0 18px; background: var(--code); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font: 15px/1.5 ui-monospace, 'DejaVu Sans Mono', monospace; color: #efe8f5; }

  footer { padding: 104px 0 48px; color: var(--muted); font-size: 15px; }
  footer .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-top: 24px; }
  footer p { margin: 14px 0 0; font-size: 13px; }

  @media (max-width: 860px) {
    nav.top { display: none; }
    .why, .split, .privacy { grid-template-columns: 1fr; }
    .split .tray { max-width: 200px; }
    .privacy { padding: 26px; }
  }
  @media (max-width: 560px) {
    body { font-size: 17px; }
    .lead { font-size: 19px; }
    .mem .bar { grid-template-columns: 1fr; gap: 4px; }
    section { padding-top: 80px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
<script>
  // Thema en taal zo vroeg mogelijk, zodat de pagina niet eerst verkeerd verschijnt
  (function () {
    let t = null, l = null;
    try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch {}
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (!l) l = (navigator.language || '').toLowerCase().startsWith('nl') ? 'nl' : 'en';
    document.documentElement.dataset.theme = t;
    document.documentElement.lang = l;
  })();
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><img src="icon.png" alt="">Tabchat</a>
    <nav class="top">
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
      <a href="#install" data-i18n="nav.install"></a>
      <a href="https://github.com/MMV2408/tabchat">GitHub</a>
    </nav>
    <div class="tools">
      <button class="tool" id="langBtn" type="button"></button>
      <button class="tool" id="themeBtn" type="button"></button>
    </div>
  </header>

  <main>
    <div class="hero">
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="get">
        <a class="btn primary" href="#install" data-i18n="hero.install"></a>
        <a class="btn ghost" href="https://snapcraft.io/tabchat" data-i18n="hero.snap"></a>
      </div>

      <p class="try" data-i18n-html="sim.try"></p>
      <div class="simbox" id="simbox">
        <div class="win" id="win" role="application" aria-label="Tabchat demo">
          <div class="titlebar"><span id="wintitle">Tabchat</span><span class="ctl" aria-hidden="true">–&nbsp;&nbsp;□&nbsp;&nbsp;✕</span></div>
          <iframe class="tabsframe" src="sim/tabs.html" title="Tabs" scrolling="no"></iframe>
          <div class="content">
            <iframe id="home" src="sim/home.html" title="Settings" hidden></iframe>
            <img id="shot" alt="" hidden>
            <div class="placeholder" id="ph" hidden><div class="badge" id="phBadge"></div><strong id="phName"></strong><span data-i18n="sim.soon"></span></div>
          </div>
        </div>
      </div>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>

    <section>
      <div class="why">
        <div>
          <h2 data-i18n="why.title"></h2>
          <p class="intro" data-i18n="why.p1"></p>
          <p class="intro" data-i18n="why.p2"></p>
        </div>
        <div class="mem" aria-hidden="true">
          <div class="bar"><span data-i18n="why.separate"></span>
            <div class="track"><div class="seg" style="width:33%;background:#25d366"></div><div class="seg" style="width:33%;background:#5865f2"></div><div class="seg" style="width:34%;background:#6264a7"></div></div></div>
          <div class="bar"><span>Tabchat</span>
            <div class="track"><div class="seg" style="width:45%;background:linear-gradient(90deg,#25d366,#5865f2,#6264a7)"></div></div></div>
          <small data-i18n="why.note"></small>
        </div>
      </div>
    </section>

    <section id="features">
      <h2 data-i18n="feat.title"></h2>
      <p class="intro" data-i18n="feat.intro"></p>
      <div class="groups">
        <div class="group" style="--c:#25d366"><h3><i></i><span data-i18n="feat.g1"></span></h3><ul data-i18n-list="feat.g1l"></ul></div>
        <div class="group" style="--c:#6264a7"><h3><i></i><span data-i18n="feat.g2"></span></h3><ul data-i18n-list="feat.g2l"></ul></div>
        <div class="group" style="--c:#5865f2"><h3><i></i><span data-i18n="feat.g3"></span></h3><ul data-i18n-list="feat.g3l"></ul></div>
      </div>
    </section>

    <section>
      <div class="split">
        <div>
          <h2 data-i18n="keys.title"></h2>
          <p class="intro" data-i18n-html="keys.p1"></p>
          <p class="intro" data-i18n="keys.p2"></p>
          <details class="keys">
            <summary data-i18n="keys.all"></summary>
            <div class="keytable" id="keytable"></div>
          </details>
        </div>
        <img class="tray" src="screenshots/tray.png" data-i18n-alt="keys.trayAlt" width="276" height="740" loading="lazy">
      </div>
    </section>

    <section id="news">
      <h2 data-i18n="news.title"></h2>
      <p class="intro" data-i18n-html="news.intro"></p>
      <div class="news" id="newslist"></div>
    </section>

    <section>
      <div class="privacy">
        <h2 data-i18n="priv.title"></h2>
        <div><p data-i18n="priv.p1"></p><p data-i18n="priv.p2"></p></div>
      </div>
    </section>

    <section id="faq" class="faq">
      <h2 data-i18n="faq.title"></h2>
      <div id="faqlist"></div>
    </section>

    <section id="install">
      <h2 data-i18n="inst.title"></h2>
      <p class="intro" data-i18n="inst.intro"></p>
      <div class="install">
        <div class="way">
          <h3>Snap Store</h3>
          <p data-i18n="inst.snap"></p>
          <pre>sudo snap install tabchat</pre>
          <a class="btn ghost" href="https://snapcraft.io/tabchat" data-i18n="inst.snapBtn"></a>
        </div>
        <div class="way">
          <h3 data-i18n="inst.debT"></h3>
          <p data-i18n="inst.deb"></p>
          <pre>sudo apt install ./tabchat_*_amd64.deb</pre>
          <a class="btn ghost" href="https://github.com/MMV2408/tabchat/releases/latest" data-i18n="inst.debBtn"></a>
        </div>
        <div class="way">
          <h3>AppImage</h3>
          <p data-i18n="inst.app"></p>
          <pre>chmod +x Tabchat-*.AppImage
./Tabchat-*.AppImage</pre>
          <a class="btn ghost" href="https://github.com/MMV2408/tabchat/releases/latest" data-i18n="inst.appBtn"></a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="row">
      <span data-i18n-html="foot.made"></span>
      <span><a href="https://github.com/MMV2408/tabchat" data-i18n="foot.source"></a> · <a href="https://github.com/MMV2408/tabchat/issues" data-i18n="foot.issue"></a> · <a href="https://tally.so/r/LZAaop" data-i18n="foot.feedback"></a></span>
    </div>
    <p data-i18n="foot.tm"></p>
  </footer>
</div>

// Screenshots per dienst in de simulatie. null = nog geen screenshot (dan een nette tijdelijke vlak).
// Een betere screenshot? Zet hem in docs/sim/shots/ (inhoud onder de tabbalk, ca. 1540×890).
const SHOTS = {
  whatsapp: 'sim/shots/whatsapp.png',
  discord: 'sim/shots/discord.png',
  teams: 'sim/shots/teams.png',
  outlook: 'sim/shots/outlook.png',
  onedrive: 'sim/shots/onedrive.png'
};

const root = document.documentElement;
let lang = root.lang, theme = root.dataset.theme, sim = null;
const T = (k) => TEXT[lang][k] ?? TEXT.en[k] ?? k;
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function applyText() {
  root.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = T(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-alt]').forEach(e => { e.alt = T(e.dataset.i18nAlt); });
  document.querySelectorAll('[data-i18n-list]').forEach(e => { e.innerHTML = T(e.dataset.i18nList).map(x => `<li>${esc(x)}</li>`).join(''); });
  document.getElementById('faqlist').innerHTML = T('faq').map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
  document.getElementById('langBtn').textContent = lang === 'en' ? 'NL' : 'EN';
  document.getElementById('langBtn').setAttribute('aria-label', T('tool.lang'));
  buildKeys(); buildNews(); if (sim) renderSim(sim);
}

function applyTheme() {
  root.dataset.theme = theme;
  const b = document.getElementById('themeBtn');
  b.textContent = theme === 'dark' ? '☀' : '☾';
  b.setAttribute('aria-label', T(theme === 'dark' ? 'tool.light' : 'tool.dark'));
  b.title = b.getAttribute('aria-label');
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1b1320' : '#faf7fc';
}

document.getElementById('langBtn').onclick = () => { lang = lang === 'en' ? 'nl' : 'en'; save('lang', lang); applyText(); applyTheme(); TabchatSim.setSite({ lang }); };
document.getElementById('themeBtn').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; save('theme', theme); applyTheme(); TabchatSim.setSite({ theme }); };

// ---------- sneltoetsen: dezelfde lijst en teksten als in de app ----------
function buildKeys() {
  const S = SIM_DATA.strings[lang];
  document.getElementById('keytable').innerHTML = SIM_DATA.keys.map(([group, rows]) =>
    `<div><h4>${esc(S[group])}</h4>` + rows.map(([combo, what]) =>
      `<div class="keyrow"><span>${esc(S[what])}</span><span>${combo.map(k => `<kbd>${esc(k)}</kbd>`).join(' + ')}</span></div>`).join('') + '</div>').join('');
}

// ---------- wat is er nieuw: rechtstreeks uit de app (changelog.js op GitHub) ----------
let changelog = SIM_DATA.changelog;
function buildNews() {
  document.getElementById('newslist').innerHTML = changelog.slice(0, 3).map(e =>
    `<article><h3>${esc(T('news.version').replace('{v}', e.v))}</h3><ul>${(e[lang] || e.en).map(x => `<li>${esc(x)}</li>`).join('')}</ul></article>`).join('');
}
fetch('https://raw.githubusercontent.com/MMV2408/tabchat/main/src/main/changelog.js').then(r => r.ok ? r.text() : Promise.reject())
  .then(src => {
    const strs = (s) => [...s.matchAll(/'((?:[^'\\]|\\.)*)'/g)].map(m => m[1].replace(/\\(.)/g, '$1'));
    const list = [...src.matchAll(/v:\s*'([^']+)',\s*nl:\s*\[([\s\S]*?)\],\s*en:\s*\[([\s\S]*?)\]/g)].map(m => ({ v: m[1], nl: strs(m[2]), en: strs(m[3]) }));
    if (list.length) { changelog = list; buildNews(); }
  }).catch(() => {});

// ---------- de simulatie ----------
const win = document.getElementById('win'), box = document.getElementById('simbox');
function fit() { const s = box.clientWidth / 1120; win.style.transform = `scale(${s})`; box.style.height = win.offsetHeight * s + 'px'; }
new ResizeObserver(fit).observe(box);

function renderSim(s) {
  sim = s;
  const simTheme = s.settings.theme === 'system' ? theme : s.settings.theme;
  win.classList.toggle('light', simTheme === 'light');
  const unread = s.tabs.reduce((n, t) => n + (typeof t.unread === 'number' ? t.unread : 0), 0);
  document.getElementById('wintitle').textContent = unread ? `Tabchat (${unread})` : 'Tabchat';
  const home = document.getElementById('home'), shot = document.getElementById('shot'), ph = document.getElementById('ph');
  const t = s.tabs.find(x => x.id === s.active);
  home.hidden = !!t; shot.hidden = true; ph.hidden = true;
  let cap = 'cap.home';
  if (t) {
    cap = 'cap.' + t.service;
    if (SHOTS[t.service]) { shot.src = SHOTS[t.service]; shot.alt = t.label; shot.hidden = false; }
    else {
      document.getElementById('phBadge').textContent = t.label[0];
      document.getElementById('phBadge').style.background = t.color;
      document.getElementById('phName').textContent = t.label;
      ph.hidden = false;
    }
  }
  document.getElementById('caption').textContent = T(cap);
}

// ---------- rechtsklikmenu van een tabblad ----------
let menu = null;
function closeMenu() { if (menu) { menu.remove(); menu = null; } }
TabchatSim.onTabMenu((id, pos) => {
  closeMenu();
  const items = TabchatSim.menuItems(id);
  if (!items.length) return;
  menu = document.createElement('div');
  menu.className = 'tabmenu' + (win.classList.contains('light') ? ' light' : '');
  menu.setAttribute('role', 'menu');
  for (const it of items) {
    if (!it) { menu.append(document.createElement('hr')); continue; }
    const b = document.createElement('button');
    b.setAttribute('role', 'menuitem'); b.disabled = !!it.disabled;
    b.innerHTML = `<span class="chk">${it.checked ? '✓' : ''}</span><span>${esc(it.label)}</span>` + (it.key ? `<span class="k">${esc(it.key)}</span>` : '');
    b.onclick = () => { closeMenu(); TabchatSim.tabAction(id, it.act); };
    menu.append(b);
  }
  document.body.append(menu);
  // Van de plek in het (verkleinde) tabbalk-venster naar de plek op de pagina
  let x = innerWidth / 2, y = innerHeight / 2;
  const fr = pos && [...document.querySelectorAll('iframe')].find(f => f.contentWindow === pos.frame);
  if (fr) { const r = fr.getBoundingClientRect(), k = r.width / fr.offsetWidth; x = r.left + pos.x * k; y = r.top + pos.y * k; }
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
  menu.querySelector('button:not(:disabled)').focus();
});
addEventListener('mousedown', (e) => { if (menu && !menu.contains(e.target)) closeMenu(); });
addEventListener('blur', () => setTimeout(() => { if (menu && !menu.contains(document.activeElement)) closeMenu(); }, 0));
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
addEventListener('scroll', closeMenu, { passive: true });

applyTheme();
applyText();
TabchatSim.setSite({ lang, theme });
TabchatSim.subscribe(renderSim);
Object.values(SHOTS).filter(Boolean).forEach(src => { new Image().src = src; }); // vooraf laden
</script>
