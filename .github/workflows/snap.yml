# Bij elke nieuwe release op GitHub: snap bouwen en in de Snap Store (App Centrum) zetten.
# Nodig: geheim SNAPCRAFT_STORE_CREDENTIALS (zie packaging/snap/README.md).
name: Snap

on:
  release:
    types: [published]
  workflow_dispatch:   # ook met de hand te starten via het tabblad Actions

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: App bouwen en snap-map klaarzetten
        run: |
          npm ci
          bash packaging/snap/build.sh --stage-only

      - name: Snap bouwen
        uses: snapcore/action-build@v1
        id: build
        with:
          path: dist/snap-stage

      - name: Naar de Snap Store (stable)
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
