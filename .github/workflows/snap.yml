# On every new GitHub release: build the snap and publish it to the Snap Store (App Center),
# for regular PCs (amd64) and for ARM computers like the Raspberry Pi (arm64).
# Needs the secret SNAPCRAFT_STORE_CREDENTIALS (see packaging/snap/README.md).
name: Snap

on:
  release:
    types: [published]
  workflow_dispatch:   # can also be started by hand from the Actions tab

jobs:
  snap:
    strategy:
      fail-fast: false   # if one architecture fails, the other still gets published
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (for the native helper)
        uses: dtolnay/rust-toolchain@stable

      - name: Build the app and stage the snap folder
        run: |
          npm ci
          bash packaging/snap/build.sh --stage-only

      - name: Build the snap
        uses: snapcore/action-build@v1
        id: build
        with:
          path: dist/snap-stage

      - name: Publish to the Snap Store (stable)
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
